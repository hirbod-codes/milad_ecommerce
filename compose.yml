    #     depends_on:
    #         - prometheus

    # ############################################################################################# OpenSearch
    # opensearch:
    #     container_name: opensearch
    #     image: opensearchproject/opensearch:2.11.1
    #     environment:
    #         - discovery.type=single-node
    #         - plugins.security.disabled=true
    #         - OPENSEARCH_INITIAL_ADMIN_PASSWORD=password
    #     # ulimits:
    #     #     memlock:
