version: '3.8'

services:
    web:
        container_name: web
        build:
            context: ../../frontend/web
            dockerfile: Dockerfile.development
        ports:
            - 80:80
            - 5173:5173
        networks:
            - web

    api:
        container_name: api
        build:
            context: .
            dockerfile: Dockerfile.development
        ports:
            - 3000:3000
        volumes:
            - .:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
        networks:
            - web
            - base
            - api

    api_mongodb:
        container_name: api_mongodb
        build:
            context: ./
            dockerfile: ./mongodb/mongodb.Dockerfile
        ports:
                - 8082:27017
        environment:
            username: admin
            password: password
            databaseName: primaryDB
        networks:
            - api

    authorization:
        container_name: authorization
        build: 
            context: ../Authorization
            dockerfile: Dockerfile.development
        ports:
            - 3001:3000
        volumes:
            - ../Authorization:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
        networks:
            - authorization
            - base

    authorization_mongodb:
        container_name: authorization_mongodb
        build:
            context: ../Authorization
            dockerfile: ../Authorization/mongodb/mongodb.Dockerfile
        ports:
                - 8083:27017
        environment:
            username: admin
            password: password
            databaseName: primaryDB
        networks:
            - authorization

    redis-1:
        container_name: redis-1
        build:
            context: ./redis
        environment:
            - HOSTNAME=redis-1
            - REDIS_CLUSTER_INIT=true
        ports:
            - 7000:6379
        networks:
            - api

    redis-2:
        container_name: redis-2
        build:
            context: ./redis
        environment:
            - HOSTNAME=redis-2
            - REDIS_CLUSTER_INIT=false
        ports:
            - 7001:6379
        networks:
            - api

    redis-3:
        container_name: redis-3
        build:
            context: ./redis
        environment:
            - HOSTNAME=redis-3
            - REDIS_CLUSTER_INIT=false
        ports:
            - 7002:6379
        networks:
            - api

    redis-4:
        container_name: redis-4
        build:
            context: ./redis
        environment:
            - HOSTNAME=redis-4
            - REDIS_CLUSTER_INIT=false
        ports:
            - 7003:6379
        networks:
            - api

    redis-5:
        container_name: redis-5
        build:
            context: ./redis
        environment:
            - HOSTNAME=redis-5
            - REDIS_CLUSTER_INIT=false
        ports:
            - 7004:6379
        networks:
            - api

    redis-6:
        container_name: redis-6
        build:
            context: ./redis
        environment:
            - HOSTNAME=redis-6
            - REDIS_CLUSTER_INIT=false
        ports:
            - 7005:6379
        networks:
            - api

networks:
    web:
    base:
    api:
    authorization:
