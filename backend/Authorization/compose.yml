version: '3.8'

services:
    authorization:
        container_name: authorization
        build: 
            context: .
            dockerfile: Dockerfile
            target: development
        ports:
            - 3001:3000
        volumes:
            - .:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
            - REDIS_TYPE=single
            - REDIS_INITIAL_NODE_URL=redis://authorization_session_redis:6379
            - DB_SUPPORTS_TRANSACTION=false
            - DB_URL=mongodb://authorization_mongodb:27017
        networks:
            - authorization

    authorization_mongodb:
        container_name: authorization_mongodb
        build:
            context: .
            dockerfile: ./mongodb/single/Dockerfile
            target: development
        ports:
                - 8083:27017
        environment:
            MONGODB_USERNAME: admin
            MONGODB_PASSWORD: password
            databaseName: primaryDB
        networks:
            - authorization

networks:
    authorization:
