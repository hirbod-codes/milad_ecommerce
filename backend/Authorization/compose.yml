version: "3.8"

services:
    authorization:
        build: 
            context: .
            dockerfile: Dockerfile.development
        ports:
            - 3001:3000
        volumes:
            - .:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development

    authorization_mongodb:
        container_name: authorization_mongodb
        build:
            context: ./
            dockerfile: ./mongodb/mongodb.Dockerfile
        ports:
                - 8082:27017
        environment:
            username: admin
            password: password
            databaseName: primaryDB
