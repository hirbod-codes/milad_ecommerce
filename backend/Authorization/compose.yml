version: '3.8'

services:
    ############################################################################################# main_mongodb
    main_mongodb:
        container_name: main_mongodb
        build:
            context: .
            dockerfile: ./mongodb/single/Dockerfile
            target: development
        ports:
                - 8083:27017
        environment:
            MONGODB_USERNAME: admin
            MONGODB_PASSWORD: password
            databaseName: primaryDB
        networks:
            - base

    ############################################################################################# revoked_access_tokens_redis
    revoked_access_tokens_redis:
        container_name: revoked_access_tokens_redis
        image: redis:7.0
        ports:
            - 6379:6379
        networks:
            - base

    ############################################################################################# rabbitmq
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:3-management
        ports:
            - "5672:5672"  # AMQP port
            - "15672:15672" # Management UI port
        environment:
            RABBITMQ_MANAGEMENT_DISABLE_METRICS_COLLECTOR: 'true'
            RABBITMQ_DEFAULT_USER: admin
            RABBITMQ_DEFAULT_PASS: password
        networks:
            - base

    ############################################################################################# authorization
    authorization:
        container_name: authorization
        build: 
            context: .
            dockerfile: Dockerfile
            target: development
        ports:
            - 3001:3000
        volumes:
            - .:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
            - ADMIN_USERNAME=username
            - ADMIN_PHONE_NUMBER=phonenumber
            - ADMIN_EMAIL=email
            - ADMIN_PASSWORD=password
            - DB_SUPPORTS_TRANSACTION=false
            - DB_URL=mongodb://main_mongodb:27017
            - REVOKED_TOKENS_REDIS_TYPE=single
            - REVOKED_TOKENS_REDIS_INITIAL_NODE_URL=redis://revoked_access_tokens_redis:6379
            - SESSION_REDIS_TYPE=single
            - SESSION_REDIS_INITIAL_NODE_URL=redis://authorization_redis:6379
            - MESSAGE_BROKER_TYPE=single
            - MESSAGE_BROKER_URL=rabbitmq:5672
            - MESSAGE_BROKER_USERNAME=admin
            - MESSAGE_BROKER_PASSWORD=password
        networks:
            - authorization

    ############################################################################################# authorization_redis
    authorization_redis:
        container_name: authorization_redis
        image: redis:7.0
        ports:
            - 6379:6379
        networks:
            - authorization_redis

networks:
    authorization:
