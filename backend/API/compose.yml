version: '3.8'

services:
    ############################################################################################# gateway
    gateway:
        container_name: gateway
        image: nginx:alpine
        volumes:
            - ../../frontend/web/dist/:/usr/share/nginx/html/
            - ../../frontend/web/nginx.development.conf:/etc/nginx/conf.d/default.conf
            - ../../frontend/web/https/:/etc/ngonx/ssl/
        ports:
            - 443:443
        depends_on:
            - api
            - authorization
        networks:
            - base

    ############################################################################################# mongo_express
    mongo_express:
        container_name: mongo_express
        image: mongo-express:latest
        environment:
            - ME_CONFIG_MONGODB_SERVER=main_mongodb
            - ME_CONFIG_MONGODB_PORT=27017
            - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
            - ME_CONFIG_MONGODB_ADMINPASSWORD=password
            - ME_CONFIG_BASICAUTH_USERNAME=admin
            - ME_CONFIG_BASICAUTH_PASSWORD=password
        ports:
            - 8081:8081
        depends_on:
            - main_mongodb
        networks:
            - base

    ############################################################################################# redis_commander
    redis_commander:
        container_name: redis_commander
        hostname: redis_commander
        user: redis
        image: ghcr.io/joeferner/redis-commander:latest
        restart: always
        environment:
            - REDIS_HOSTS=local:revoked_access_tokens_redis:6379,local:api_redis:6379,local:authorization_redis:6379
        ports:
            - 8082:8081
        depends_on:
            - revoked_access_tokens_redis
            - authorization_redis
            - api_redis
        networks:
            - base
            - api_redis
            - authorization_redis

    ############################################################################################# main_mongodb
    main_mongodb:
        container_name: main_mongodb
        build:
            context: .
            dockerfile: mongodb/single/Dockerfile
            target: development
        ports:
                - 8083:27017
        environment:
            MONGODB_USERNAME: admin
            MONGODB_PASSWORD: password
            databaseName: primaryDB
        networks:
            - base

    ############################################################################################# revoked_access_tokens_redis
    revoked_access_tokens_redis:
        container_name: revoked_access_tokens_redis
        image: redis:7.0
        ports:
            - 6379:6379
        networks:
            - base

    ############################################################################################# rabbitmq
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:3-management
        ports:
            - "5672:5672"  # AMQP port
            - "15672:15672" # Management UI port
        environment:
            RABBITMQ_MANAGEMENT_DISABLE_METRICS_COLLECTOR: 'true'
            RABBITMQ_DEFAULT_USER: admin
            RABBITMQ_DEFAULT_PASS: password
        networks:
            - base

    ############################################################################################# api
    api:
        container_name: api
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        ports:
            - 3000:3000
        volumes:
            - .:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
            - DB_SUPPORTS_TRANSACTION=false
            - DB_URL=mongodb://main_mongodb:27017
            - SESSION_REDIS_TYPE=single
            - SESSION_REDIS_INITIAL_NODE_URL=redis://api_redis:6379
            - REVOKED_TOKENS_REDIS_TYPE=single
            - REVOKED_TOKENS_REDIS_INITIAL_NODE_URL=redis://revoked_access_tokens_redis:6379
            - MESSAGE_BROKER_TYPE=single
            - MESSAGE_BROKER_URL=rabbitmq:5672
            - MESSAGE_BROKER_USERNAME=admin
            - MESSAGE_BROKER_PASSWORD=password
        networks:
            - base
            - api
            - api_redis

    ############################################################################################# api_redis
    api_redis:
        container_name: api_session_redis
        image: redis:7.0
        ports:
            - 6380:6379
        networks:
            - api_redis

    ############################################################################################# authorization
    authorization:
        container_name: authorization
        build: 
            context: ../Authorization
            dockerfile: Dockerfile
            target: development
        ports:
            - 3001:3000
        volumes:
            - ../Authorization:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
            - ADMIN_USERNAME=username
            - ADMIN_PHONE_NUMBER=phonenumber
            - ADMIN_EMAIL=email
            - ADMIN_PASSWORD=password
            - DB_SUPPORTS_TRANSACTION=false
            - DB_URL=mongodb://main_mongodb:27017
            - SESSION_REDIS_TYPE=single
            - SESSION_REDIS_INITIAL_NODE_URL=redis://authorization_redis:6379
            - REVOKED_TOKENS_REDIS_TYPE=single
            - REVOKED_TOKENS_REDIS_INITIAL_NODE_URL=redis://revoked_access_tokens_redis:6379
            - MESSAGE_BROKER_TYPE=single
            - MESSAGE_BROKER_URL=rabbitmq:5672
            - MESSAGE_BROKER_USERNAME=admin
            - MESSAGE_BROKER_PASSWORD=password
        networks:
            - base
            - authorization
            - authorization_redis

    ############################################################################################# authorization_redis
    authorization_redis:
        container_name: authorization_redis
        image: redis:7.0
        ports:
            - 6381:6379
        networks:
            - authorization_redis

networks:
    base:
    api:
    api_redis:
    authorization:
    authorization_redis:
