version: '3.8'

services:
    web:
        container_name: web
        build:
            context: ../../frontend/web/
            dockerfile: Dockerfile.development
        ports:
          - 80:80
        networks:
            - web

    api:
        container_name: api
        build:
            context: ../API
            dockerfile: Dockerfile.development
        ports:
            - 3000:3000
        volumes:
            - ../API:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
        networks:
            - base
            - api

    api_mongodb:
        container_name: api_mongodb
        build:
            context: ../API
            dockerfile: mongodb/mongodb.Dockerfile
        ports:
                - 8082:27017
        environment:
            username: admin
            password: password
            databaseName: primaryDB
        networks:
            - api

    # api_session_redis:
    #     container_name: api_session_redis
    #     image: redis:7.0
    #     ports:
    #         - 6379:6379
    #     networks:
    #         - api

    # api_cache_redis:
    #     container_name: api_cache_redis
    #     image: redis:7.0
    #     ports:
    #         - 6379:6379
    #     networks:
    #         - api

    authorization:
        container_name: authorization
        build: 
            context: .
            dockerfile: Dockerfile.development
        ports:
            - 3001:3000
        volumes:
            - .:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
        networks:
            - authorization
            - base

    authorization_mongodb:
        container_name: authorization_mongodb
        build:
            context: .
            dockerfile: ./mongodb/mongodb.Dockerfile
        ports:
                - 8083:27017
        environment:
            username: admin
            password: password
            databaseName: primaryDB
        networks:
            - authorization

    authorization_session_redis:
        container_name: authorization_session_redis
        image: redis:7.0
        ports:
            - 6379:6379
        networks:
            - authorization

    # authorization_revoked_tokens_redis:
    #     container_name: authorization_revoked_tokens_redis
    #     image: redis:7.0
    #     ports:
    #         - 6379:6379
    #     networks:
    #         - authorization

networks:
    web:
    base:
    api:
    authorization:
